# kata-managed — source: yukimemi/pj-nvim/.github/workflows/ci.yml.tera
# Local edits are reverted on the next `kata apply`. Push fixes upstream.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }} / nvim ${{ matrix.nvim }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        nvim: [stable, nightly]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.1.0

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      - name: Clone plenary.nvim
        uses: actions/checkout@v6.1.0
        with:
          repository: nvim-lua/plenary.nvim
          path: deps/plenary.nvim

      - name: Run tests
        shell: bash
        run: |
          # Specs are enumerated in the shell rather than with
          # PlenaryBustedDirectory: that command spawns pwsh on Windows
          # runners to walk the directory, and pwsh's ~5s startup blows
          # plenary's internal timeout. Running each spec in its own nvim
          # invocation behaves identically on Linux / macOS / Windows.
          set -euo pipefail
          # A plugin with no suite yet is a valid consumer of this layer;
          # `find` on a missing path exits non-zero and would fail the job
          # under `set -e`.
          if [ ! -d tests ]; then
            echo "no tests/ directory — skipping"
            exit 0
          fi
          status=0
          while IFS= read -r spec; do
            echo "::group::$spec"
            nvim --headless --noplugin -u tests/minimal_init.lua \
              -c "PlenaryBustedFile $spec" || status=$?
            echo "::endgroup::"
          done < <(find tests -type f -name '*_spec.lua' | sort)
          exit $status

  lint:
    name: stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .
